services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bible_platform
      POSTGRES_USER: bible
      POSTGRES_PASSWORD: bible
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  postgres_data:
